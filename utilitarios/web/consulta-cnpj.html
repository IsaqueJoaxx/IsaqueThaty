<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta CNPJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .spin { animation: spin 0.9s linear infinite; }
    .fade-up { animation: fadeUp 0.35s ease-out both; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Mono', 'Consolas', monospace; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-indigo-50 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback } = React;

    /* ─── Masks & Formatters ─── */
    const maskCNPJ = (v) => {
      const d = v.replace(/\D/g, '').slice(0, 14);
      if (d.length <=  2) return d;
      if (d.length <=  5) return `${d.slice(0,2)}.${d.slice(2)}`;
      if (d.length <=  8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
      if (d.length <= 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
      return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
    };

    const fmtCNPJ = (v = '') => maskCNPJ(String(v).replace(/\D/g, ''));
    const fmtCEP  = (v = '') => {
      const d = String(v).replace(/\D/g, '');
      return d.length >= 8 ? `${d.slice(0,5)}-${d.slice(5,8)}` : d;
    };
    const fmtDate = (v) => {
      if (!v) return null;
      const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? `${m[3]}/${m[2]}/${m[1]}` : String(v);
    };
    const fmtBool = (v) => v === true ? 'Sim' : v === false ? 'Não' : String(v);
    const fmtCurrency = (v) =>
      new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(v));
    const fmtPhone = (v) => {
      const d = String(v).replace(/\D/g, '');
      if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
      if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
      return String(v);
    };

    const smartFmt = (key, val) => {
      if (val === null || val === undefined) return null;
      if (typeof val === 'boolean') return fmtBool(val);
      const k = String(key).toLowerCase();
      if (k.includes('capital')) return fmtCurrency(val);
      if (k.includes('cep'))    return fmtCEP(String(val));
      if (k.includes('cnpj'))   return fmtCNPJ(String(val));
      if (k.includes('data') || k.includes('date') || k.includes('abertura') || k.includes('inicio'))
        return fmtDate(val);
      if (k.includes('telefone') || k.includes('fone') || k.includes('phone'))
        return fmtPhone(String(val));
      return String(val);
    };

    const LABELS = {
      cnpj:'CNPJ', razao_social:'Razão Social', nome_fantasia:'Nome Fantasia',
      capital_social:'Capital Social', porte:'Porte', natureza_juridica:'Natureza Jurídica',
      logradouro:'Logradouro', numero:'Número', complemento:'Complemento',
      bairro:'Bairro', municipio:'Município', uf:'UF', cep:'CEP',
      email:'E-mail', telefone_1:'Telefone 1', telefone_2:'Telefone 2',
      situacao_cadastral:'Situação Cadastral', data_situacao_cadastral:'Data da Situação',
      motivo_situacao_cadastral:'Motivo', data_abertura:'Data de Abertura',
      data_inicio_atividade:'Início da Atividade', cnae_fiscal:'CNAE Fiscal',
      cnae_fiscal_descricao:'Descrição CNAE', cnaes_secundarios:'CNAEs Secundários',
      inscricoes_estaduais:'Inscrições Estaduais', socios:'Sócios',
      estabelecimento:'Estabelecimento', descricao:'Descrição', codigo:'Código',
      id:'ID', tipo:'Tipo', nome:'Nome', pais:'País', ativo:'Ativo',
      atualizado_em:'Atualizado em', criado_em:'Criado em',
      qualificacao_do_responsavel:'Qualificação do Responsável',
      cpf_representante_legal:'CPF Representante Legal',
      nome_representante_legal:'Nome Representante Legal',
      data_entrada_sociedade:'Entrada na Sociedade',
    };
    const humanize = (k) =>
      LABELS[k] || k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());

    /* ─── Count filled fields ─── */
    const countFields = (v, d = 0) => {
      if (d > 6 || v === null || v === undefined || v === '') return 0;
      if (Array.isArray(v)) return v.length === 0 ? 0 : 1 + v.reduce((a,i) => a + countFields(i,d+1), 0);
      if (typeof v === 'object') return Object.values(v).reduce((a,i) => a + countFields(i,d+1), 0);
      return 1;
    };

    /* ─── SVG Icons ─── */
    const I = (p) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={p.w||2}
           strokeLinecap="round" strokeLinejoin="round" className={p.cls||'w-4 h-4'}>
        {p.children}
      </svg>
    );
    const IconSearch  = () => <I><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></I>;
    const IconCopy    = () => <I><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></I>;
    const IconCode    = () => <I><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></I>;
    const IconCheck   = () => <I><path d="M20 6 9 17l-5-5"/></I>;
    const IconX       = () => <I cls="w-5 h-5"><path d="M18 6 6 18M6 6l12 12"/></I>;
    const IconChevD   = () => <I><path d="m6 9 6 6 6-6"/></I>;
    const IconChevR   = () => <I><path d="m9 18 6-6-6-6"/></I>;
    const IconBuilding= () => <I w={1.5} cls="w-6 h-6">
      <path d="M3 21h18M4 21V7l8-4v18M12 3l8 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/>
    </I>;
    const IconInfo    = () => <I cls="w-5 h-5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></I>;

    /* ─── Dynamic value renderer ─── */
    const DynamicValue = ({ k, v, depth = 0 }) => {
      const [open, setOpen] = useState(depth < 1);
      if (v === null || v === undefined || v === '') return <span className="text-gray-400 italic text-sm">—</span>;
      if (typeof v === 'boolean') return (
        <span className={`text-sm font-semibold ${v ? 'text-emerald-600' : 'text-rose-500'}`}>
          {v ? '✓ Sim' : '✗ Não'}
        </span>
      );
      if (!v || typeof v !== 'object') return (
        <span className="text-sm text-gray-800 break-words">{smartFmt(k, v) ?? '—'}</span>
      );

      if (Array.isArray(v)) {
        if (v.length === 0) return <span className="text-gray-400 italic text-sm">Vazio</span>;
        const allPrimitive = v.every(i => typeof i !== 'object' || i === null);
        if (allPrimitive) return (
          <div className="flex flex-wrap gap-1 mt-0.5">
            {v.map((i, idx) => (
              <span key={idx} className="bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded-full mono">
                {smartFmt(k, i)}
              </span>
            ))}
          </div>
        );
        return (
          <div>
            <button onClick={() => setOpen(o => !o)}
              className="flex items-center gap-1 text-indigo-600 text-xs font-semibold hover:text-indigo-800 transition-colors mt-0.5">
              {open ? <IconChevD/> : <IconChevR/>}
              {v.length} {v.length === 1 ? 'item' : 'itens'}
            </button>
            {open && (
              <div className="mt-2 space-y-2">
                {v.map((item, idx) => (
                  <div key={idx} className="border border-slate-200 rounded-xl p-3 bg-slate-50">
                    <p className="text-[10px] font-bold text-slate-400 mb-2 uppercase tracking-widest">Item {idx+1}</p>
                    <DynamicObject obj={item} depth={depth+1}/>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      const keys = Object.keys(v);
      return (
        <div>
          <button onClick={() => setOpen(o => !o)}
            className="flex items-center gap-1 text-indigo-600 text-xs font-semibold hover:text-indigo-800 transition-colors mt-0.5">
            {open ? <IconChevD/> : <IconChevR/>}
            {keys.length} {keys.length === 1 ? 'campo' : 'campos'}
          </button>
          {open && (
            <div className="mt-2 pl-3 border-l-2 border-indigo-100">
              <DynamicObject obj={v} depth={depth+1}/>
            </div>
          )}
        </div>
      );
    };

    const DynamicObject = ({ obj, depth = 0 }) => {
      if (!obj || typeof obj !== 'object' || Array.isArray(obj))
        return <DynamicValue v={obj} depth={depth}/>;
      return (
        <dl className="space-y-2">
          {Object.entries(obj).map(([k, v]) => (
            <div key={k} className="grid items-start" style={{gridTemplateColumns:'minmax(110px,38%) 1fr', gap:'6px'}}>
              <dt className="text-[11px] font-semibold text-slate-500 pt-0.5 leading-tight">{humanize(k)}</dt>
              <dd><DynamicValue k={k} v={v} depth={depth}/></dd>
            </div>
          ))}
        </dl>
      );
    };

    /* ─── Summary card ─── */
    const pick = (...vals) => vals.find(v => v !== undefined && v !== null && v !== '');

    const SituacaoBadge = ({ sit }) => {
      const text = sit?.descricao || sit?.nome || (typeof sit === 'string' ? sit : '');
      const active = /ativ/i.test(text);
      return (
        <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold ${
          active ? 'bg-emerald-100 text-emerald-800' : text ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'
        }`}>
          <span className={`w-2 h-2 rounded-full flex-shrink-0 ${active ? 'bg-emerald-500' : text ? 'bg-rose-400' : 'bg-slate-400'}`}/>
          {text || 'Desconhecida'}
        </span>
      );
    };

    const Field = ({ label, value }) => {
      if (!value) return null;
      return (
        <div className="flex flex-col gap-0.5">
          <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{label}</p>
          <p className="text-sm text-slate-800 break-words leading-snug">{value}</p>
        </div>
      );
    };

    const SummaryCard = ({ data }) => {
      const est  = data.estabelecimento || {};
      const sit  = pick(data.situacao_cadastral, est.situacao_cadastral);
      const mun  = pick(data.municipio?.nome, data.municipio, est.cidade?.nome, est.municipio?.nome, est.municipio);
      const uf   = pick(data.uf, data.estado?.sigla, est.estado?.sigla, est.uf);
      const cnae = pick(data.cnae_fiscal, est.cnae_fiscal);
      const cnaeParts = [cnae?.codigo || cnae?.id, cnae?.descricao || data.cnae_fiscal_descricao].filter(Boolean);
      const tel  = pick(data.telefone_1, est.telefone1, est.telefone_1);
      const mail = pick(data.email, est.email);
      const fantasia = pick(data.nome_fantasia, est.nome_fantasia);
      const cepRaw = pick(data.cep, est.cep);
      const insc = pick(data.inscricoes_estaduais, est.inscricoes_estaduais);

      const addrParts = [
        pick(data.logradouro, est.logradouro),
        pick(data.numero, est.numero),
        pick(data.complemento, est.complemento),
        pick(data.bairro, est.bairro),
      ].filter(Boolean);

      return (
        <div className="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden fade-up">
          <div className="bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-800 px-6 py-6">
            <div className="flex flex-wrap items-start justify-between gap-4">
              <div>
                <h2 className="text-2xl font-bold text-white leading-tight">{data.razao_social || 'Empresa'}</h2>
                {fantasia && <p className="text-indigo-200 text-sm mt-1 font-medium">{fantasia}</p>}
                <p className="text-indigo-300 text-sm mt-2 mono">{fmtCNPJ(data.cnpj || est.cnpj || '')}</p>
              </div>
              <SituacaoBadge sit={sit}/>
            </div>
          </div>

          <div className="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-5">
            <Field label="Endereço"      value={addrParts.join(', ')}/>
            <Field label="Cidade / UF"   value={[mun, uf].filter(Boolean).join(' / ')}/>
            <Field label="CEP"           value={cepRaw ? fmtCEP(String(cepRaw)) : null}/>
            <Field label="CNAE Principal" value={cnaeParts.join(' — ')}/>
            <Field label="Telefone"      value={tel ? fmtPhone(String(tel)) : null}/>
            <Field label="E-mail"        value={mail}/>
            <Field label="Capital Social" value={data.capital_social != null ? fmtCurrency(data.capital_social) : null}/>
            <Field label="Porte"         value={data.porte?.descricao || (typeof data.porte === 'string' ? data.porte : null)}/>
            <Field label="Natureza Jurídica" value={data.natureza_juridica?.descricao || (typeof data.natureza_juridica === 'string' ? data.natureza_juridica : null)}/>
            <Field label="Início da Atividade" value={fmtDate(pick(data.data_inicio_atividade, est.data_inicio_atividade))}/>
            <Field label="Data da Situação"    value={fmtDate(pick(data.data_situacao_cadastral, est.data_situacao_cadastral))}/>
            <Field label="Motivo da Situação"  value={pick(data.motivo_situacao_cadastral?.descricao, est.motivo_situacao_cadastral?.descricao)}/>
          </div>

          {Array.isArray(insc) && insc.length > 0 && (
            <div className="px-6 pb-6 border-t border-slate-100 pt-5">
              <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">Inscrições Estaduais</p>
              <div className="flex flex-wrap gap-2">
                {insc.map((ie, i) => {
                  const sigla = ie.estado?.sigla || ie.uf || ie.estado || '';
                  const num   = ie.inscricao_estadual || ie.numero || ie.ie || '';
                  const ativo = ie.ativo;
                  return (
                    <span key={i} className="inline-flex items-center gap-1.5 bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-full font-medium">
                      {sigla && <span className="font-bold text-slate-900">{sigla}</span>}
                      {num && <span className="mono">{num}</span>}
                      {ativo !== undefined && (
                        <span className={`w-1.5 h-1.5 rounded-full ${ativo ? 'bg-emerald-400' : 'bg-rose-400'}`}/>
                      )}
                    </span>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ─── Dynamic Section ─── */
    const DynamicSection = ({ data }) => {
      const [open, setOpen] = useState({});
      const toggle = (k) => setOpen(s => ({ ...s, [k]: !s[k] }));

      const primitives = [], objects = [], arrays = [];
      Object.entries(data).forEach(([k, v]) => {
        if (v === null || v === undefined) return;
        if (typeof v !== 'object') primitives.push([k, v]);
        else if (Array.isArray(v)) arrays.push([k, v]);
        else objects.push([k, v]);
      });

      const SectionHeader = ({ k, badge, badgeCls }) => (
        <button onClick={() => toggle(k)}
          className="w-full flex items-center justify-between px-6 py-4 hover:bg-slate-50 transition-colors text-left group">
          <span className="font-semibold text-slate-700 group-hover:text-slate-900">{humanize(k)}</span>
          <div className="flex items-center gap-2 text-slate-400">
            <span className={`text-xs px-2.5 py-0.5 rounded-full font-medium ${badgeCls}`}>{badge}</span>
            {open[k] ? <IconChevD/> : <IconChevR/>}
          </div>
        </button>
      );

      return (
        <div className="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden fade-up">
          <div className="px-6 py-5 border-b border-slate-100 bg-slate-50">
            <h2 className="text-base font-bold text-slate-800">Todos os Dados Retornados</h2>
            <p className="text-xs text-slate-500 mt-0.5">Todos os campos do JSON, inclusive objetos e listas aninhadas</p>
          </div>

          {primitives.length > 0 && (
            <div className="px-6 py-5 border-b border-slate-50">
              <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Campos Simples</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-10 gap-y-4">
                {primitives.map(([k, v]) => (
                  <div key={k}>
                    <p className="text-[11px] font-semibold text-slate-400">{humanize(k)}</p>
                    <p className="text-sm text-slate-800 mt-0.5 break-words mono">{smartFmt(k, v) ?? '—'}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          {objects.map(([k, v]) => (
            <div key={k} className="border-b border-slate-50 last:border-0">
              <SectionHeader k={k}
                badge={`${Object.keys(v).length} campos`}
                badgeCls="bg-indigo-50 text-indigo-600"/>
              {open[k] && (
                <div className="px-6 pb-5"><DynamicObject obj={v} depth={1}/></div>
              )}
            </div>
          ))}

          {arrays.map(([k, v]) => (
            <div key={k} className="border-b border-slate-50 last:border-0">
              <SectionHeader k={k}
                badge={`${v.length} ${v.length===1?'item':'itens'}`}
                badgeCls="bg-violet-50 text-violet-600"/>
              {open[k] && (
                <div className="px-6 pb-5">
                  <DynamicValue k={k} v={v} depth={1}/>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    };

    /* ─── JSON Modal ─── */
    const JSONModal = ({ data, onClose }) => {
      const [copied, setCopied] = useState(false);
      const json = JSON.stringify(data, null, 2);
      const copy = async () => {
        await navigator.clipboard.writeText(json);
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-up"
             onClick={onClose}>
          <div className="bg-gray-950 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[88vh] flex flex-col"
               onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-3.5 border-b border-gray-800">
              <h3 className="text-white font-bold flex items-center gap-2 text-sm">
                <IconCode/> JSON Bruto
              </h3>
              <div className="flex items-center gap-2">
                <button onClick={copy}
                  className={`flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all ${
                    copied ? 'bg-emerald-600 text-white' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                  }`}>
                  {copied ? <><IconCheck/> Copiado!</> : <><IconCopy/> Copiar</>}
                </button>
                <button onClick={onClose} className="text-gray-500 hover:text-white transition-colors p-1 rounded">
                  <IconX/>
                </button>
              </div>
            </div>
            <pre className="overflow-auto p-5 text-xs text-emerald-400 mono leading-relaxed flex-1 whitespace-pre-wrap">{json}</pre>
          </div>
        </div>
      );
    };

    /* ─── App ─── */
    const App = () => {
      const [cnpj, setCnpj]     = useState('');
      const [loading, setLoading] = useState(false);
      const [data, setData]     = useState(null);
      const [error, setError]   = useState('');
      const [showJSON, setShowJSON] = useState(false);
      const [copied, setCopied] = useState(false);

      const raw = cnpj.replace(/\D/g, '');
      const valid = raw.length === 14;

      const buscar = async () => {
        if (!valid) { setError('Digite os 14 dígitos do CNPJ.'); return; }
        setLoading(true); setError(''); setData(null);
        try {
          const res = await fetch(`https://publica.cnpj.ws/cnpj/${raw}`);
          if (res.status === 429) throw new Error('Muitas requisições. Aguarde alguns segundos e tente novamente.');
          if (res.status === 404) throw new Error('CNPJ não encontrado na base de dados.');
          if (!res.ok) throw new Error(`Erro HTTP ${res.status}. Tente novamente.`);
          setData(await res.json());
        } catch (e) {
          setError(e.name === 'TypeError'
            ? 'Falha na conexão. Verifique sua internet. (A API pode bloquear CORS em alguns ambientes — neste caso, abra o arquivo em um servidor local.)'
            : e.message);
        } finally { setLoading(false); }
      };

      const copyJSON = async () => {
        await navigator.clipboard.writeText(JSON.stringify(data, null, 2));
        setCopied(true); setTimeout(() => setCopied(false), 2500);
      };

      const fieldCount = data ? countFields(data) : 0;

      return (
        <div className="min-h-screen">
          {/* Header */}
          <header className="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-40">
            <div className="max-w-4xl mx-auto px-4 py-3 flex items-center gap-3">
              <div className="bg-indigo-600 rounded-xl p-1.5 text-white"><IconBuilding/></div>
              <div>
                <h1 className="text-lg font-bold text-slate-900 leading-none">Consulta CNPJ</h1>
                <p className="text-[11px] text-slate-500">publica.cnpj.ws</p>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 space-y-5 pb-16">
            {/* Search */}
            <div className="bg-white rounded-2xl shadow border border-slate-100 p-6">
              <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">CNPJ</label>
              <div className="flex gap-3 flex-wrap sm:flex-nowrap">
                <input
                  type="text" value={cnpj} maxLength={18}
                  placeholder="00.000.000/0000-00"
                  onChange={e => { setCnpj(maskCNPJ(e.target.value)); setError(''); }}
                  onKeyDown={e => e.key === 'Enter' && buscar()}
                  className="flex-1 border border-slate-300 rounded-xl px-4 py-3.5 text-xl mono tracking-widest
                             focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                             transition placeholder:text-slate-300"
                />
                <button onClick={buscar} disabled={loading || !valid}
                  className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800
                             disabled:bg-indigo-300 disabled:cursor-not-allowed
                             text-white font-bold px-7 py-3.5 rounded-xl transition-all shadow-sm hover:shadow-md
                             text-sm whitespace-nowrap">
                  {loading
                    ? <div className="spin w-4 h-4 rounded-full border-2 border-white/30 border-t-white"/>
                    : <IconSearch/>}
                  {loading ? 'Consultando…' : 'Consultar'}
                </button>
              </div>

              {error && (
                <div className="mt-4 flex items-start gap-3 bg-rose-50 border border-rose-200 rounded-xl px-4 py-3">
                  <span className="text-rose-500 flex-shrink-0 mt-0.5"><IconInfo/></span>
                  <p className="text-rose-700 text-sm leading-relaxed">{error}</p>
                </div>
              )}
            </div>

            {/* Loading skeleton */}
            {loading && (
              <div className="bg-white rounded-2xl border border-slate-100 shadow p-8 flex items-center justify-center gap-4">
                <div className="spin w-10 h-10 rounded-full border-4 border-indigo-100 border-t-indigo-600"/>
                <p className="text-slate-500 font-medium">Consultando CNPJ…</p>
              </div>
            )}

            {data && !loading && (
              <>
                {/* Toolbar */}
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div className="flex items-center gap-2 bg-white rounded-full border border-slate-200 px-4 py-2 shadow-sm text-sm">
                    <span className="w-2 h-2 bg-emerald-400 rounded-full"/>
                    <span className="text-slate-600">
                      <strong className="text-slate-900 font-bold">{fieldCount}</strong> campos preenchidos
                    </span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={copyJSON}
                      className={`flex items-center gap-1.5 text-xs font-semibold px-4 py-2 rounded-xl border transition-all ${
                        copied
                          ? 'bg-emerald-50 border-emerald-300 text-emerald-700'
                          : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300 shadow-sm'
                      }`}>
                      {copied ? <><IconCheck/> Copiado!</> : <><IconCopy/> Copiar JSON</>}
                    </button>
                    <button onClick={() => setShowJSON(true)}
                      className="flex items-center gap-1.5 text-xs font-semibold px-4 py-2 rounded-xl border
                                 border-slate-200 bg-white text-slate-600 hover:border-slate-300 shadow-sm transition-all">
                      <IconCode/> Ver JSON
                    </button>
                  </div>
                </div>

                <SummaryCard data={data}/>
                <DynamicSection data={data}/>
              </>
            )}

            {!data && !loading && !error && (
              <div className="text-center py-16 text-slate-400">
                <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-slate-100 mb-4 text-slate-300">
                  <IconBuilding/>
                </div>
                <p className="font-medium text-slate-500">Digite um CNPJ para começar</p>
                <p className="text-sm mt-1">Os dados são consultados em tempo real na API pública</p>
              </div>
            )}
          </main>

          {showJSON && data && <JSONModal data={data} onClose={() => setShowJSON(false)}/>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
