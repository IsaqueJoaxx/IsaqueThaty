<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>ECO DE ZERON — um metroidvania</title>
<style>
  html,body{margin:0;padding:0;background:#05060a;height:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-family:monospace}
  #wrap{position:relative}
  canvas{width:1024px;height:576px;image-rendering:pixelated;image-rendering:crisp-edges;
    background:#05060a;box-shadow:0 0 60px #0a3a3a66;border:1px solid #123}
  #scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 2px,#00000022 2px 4px)}
  @media (max-width:1060px){ canvas{width:96vw;height:54vw} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="512" height="288"></canvas>
  <div id="scan"></div>
</div>
<script>
"use strict";
// ============================================================================
//  ECO DE ZERON — metroidvania original inspirado nos classicos de exploracao
//  Arte, mapa, codigo e sons: gerados por codigo. Nenhum asset de terceiros.
// ============================================================================
const CV = document.getElementById('cv'), CX = CV.getContext('2d');
CX.imageSmoothingEnabled = false;
const W = 96, H = 48, T = 16;            // mundo em tiles
const VW = 512, VH = 288;                // viewport px

// ---------------------------------------------------------------- mapa
// ops: ['c',x,y,w,h]=cavar  ['f',x,y,w,h,ch]=preencher  ['s',x,y,ch]=definir
const OPS = [
  // ---- banda A: superficie
  ['c',1,0,94,11],
  ['f',64,3,1,13,'#'],          // muralha do planalto leste
  ['f',65,8,30,1,'#'],          // piso do planalto
  ['c',66,8,2,1],               // bocas do corredor de velocidade
  ['f',70,9,4,2,'Q'],           // blocos ambar (turbinas)
  ['s',90,9,'E'],
  ['f',40,8,4,1,'#'],['f',46,5,4,1,'#'],['f',52,3,4,1,'#'],  // plataformas
  ['c',56,11,4,5],              // poco central
  ['s',8,10,'V'],['s',9,10,'V'],
  ['s',70,7,'T'],['s',78,7,'U'],
  ['s',30,10,'c'],['s',44,10,'c'],['s',50,6,'f'],
  ['s',4,9,'P'],
  // ---- banda B: cavernas medias
  ['c',56,16,4,13],             // poco (largo) ate a fileira 28
  ['c',56,29,2,3],              // poco estreito
  ['c',6,19,49,4],              // galeria oeste
  ['f',55,19,1,3,'D'],          // porta azul
  ['f',10,22,3,1,'#'],['s',11,21,'M'],
  ['s',16,22,'V'],['s',17,22,'V'],
  ['s',30,22,'c'],['s',42,22,'c'],
  ['c',6,23,3,1],               // alcapao da galeria
  ['c',2,24,7,3],['s',2,26,'#'],// camara de descida (com degrau)
  ['c',9,26,12,1],              // tunel de esfera
  ['c',19,27,2,6],              // queda para o subsolo
  ['c',73,17,22,12],            // arena do guardiao
  ['c',61,24,12,5],             // corredor leste
  ['f',60,25,1,3,'R'],          // porta vermelha
  ['f',58,28,2,1,'#'],['f',58,25,2,1,'#'],['f',56,22,2,1,'#'],   // degraus
  ['f',58,19,2,1,'#'],['f',58,16,2,1,'#'],['f',56,14,2,1,'#'],   // do poco
  ['s',84,22,'X'],
  // ---- banda C: subsolo profundo
  ['c',2,33,29,6],              // salao das esferas
  ['f',4,35,3,1,'#'],['s',5,34,'B'],
  ['f',31,36,3,2,'C'],          // parede rachada -> lago
  ['c',34,36,24,8],             // caverna do lago
  ['c',56,32,2,4],              // poco estreito (continuacao)
  ['s',57,35,'#'],['s',56,32,'#'],['s',57,29,'#'],                // degraus
  ['f',46,40,4,1,'#'],['s',47,39,'J'],
  ['f',54,41,2,1,'#'],['f',56,38,2,1,'#'],
  ['c',28,39,2,1],['c',6,40,24,1],['s',7,40,'m'],                 // tunel bonus
  ['f',38,44,5,2,'~'],          // poca de acido
  ['c',60,38,35,6],             // deposito leste
  ['f',58,42,2,2,'C'],          // parede rachada -> deposito
  ['s',65,43,'m'],['s',75,43,'E'],['s',85,43,'m'],
  ['s',70,40,'f'],['s',88,43,'c'],['s',36,40,'f'],
  ['s',78,43,'^'],['s',79,43,'^'],
  ['s',52,43,'V'],['s',53,43,'V'],
];
let grid, startPos = [64,144], bossSpawn = [84*T,22*T];
const SOLID = '#CQDRV';
function buildMap(){
  grid = Array.from({length:H}, () => Array(W).fill('#'));
  const set = (x,y,c) => { if(x>=0&&x<W&&y>=0&&y<H) grid[y][x]=c; };
  for(const o of OPS){
    if(o[0]==='s') set(o[1],o[2],o[3]);
    else for(let y=o[2];y<o[2]+o[4];y++) for(let x=o[1];x<o[1]+o[3];x++)
      set(x,y,o[0]==='c'?'.':o[5]);
  }
}
function tileAt(px,py){
  const x=Math.floor(px/T), y=Math.floor(py/T);
  if(x<0||x>=W||y<0||y>=H) return '#';
  return grid[y][x];
}
function solidAt(px,py){ return SOLID.includes(tileAt(px,py)); }

// ---------------------------------------------------------------- audio
let AC=null, droneOn=false;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(f0,f1,dur,type,vol,delay){
  try{
    const a=ac(), t0=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
const sfx = {
  shoot:  ()=>tone(900,250,0.09,'square',0.07),
  charged:()=>{tone(300,1200,0.18,'sawtooth',0.12);tone(150,600,0.25,'square',0.08);},
  missile:()=>tone(220,90,0.3,'sawtooth',0.12),
  jump:   ()=>tone(260,520,0.12,'triangle',0.1),
  jump2:  ()=>tone(380,760,0.12,'triangle',0.1),
  hurt:   ()=>{tone(200,60,0.25,'sawtooth',0.16);},
  die:    ()=>{tone(400,40,0.8,'sawtooth',0.2);},
  ekill:  ()=>{tone(500,80,0.2,'square',0.1);},
  door:   ()=>{tone(150,700,0.25,'square',0.1);},
  deny:   ()=>tone(140,120,0.12,'square',0.1),
  bomb:   ()=>tone(700,1100,0.12,'sine',0.08),
  boom:   ()=>{tone(160,40,0.4,'sawtooth',0.18);tone(90,30,0.5,'square',0.12);},
  ball:   ()=>tone(600,300,0.08,'triangle',0.08),
  orb:    ()=>tone(1000,1500,0.08,'sine',0.09),
  save:   ()=>{[440,660,880].forEach((f,i)=>tone(f,f,0.15,'triangle',0.09,i*0.09));},
  pickup: ()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.22,'triangle',0.11,i*0.11));},
  bosshit:()=>tone(120,300,0.1,'square',0.12),
  qbreak: ()=>tone(800,200,0.15,'square',0.1),
};
function startDrone(){
  if(droneOn) return; droneOn=true;
  try{
    const a=ac(), o=a.createOscillator(), g=a.createGain(), l=a.createOscillator(), lg=a.createGain();
    o.type='triangle'; o.frequency.value=55;
    l.frequency.value=0.08; lg.gain.value=8; l.connect(lg); lg.connect(o.frequency);
    g.gain.value=0.035; o.connect(g); g.connect(a.destination); o.start(); l.start();
  }catch(e){}
}

// ---------------------------------------------------------------- entrada
const keys={}, prev={};
const KMAP = {ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',
  ArrowDown:'DN',s:'DN',z:'J',' ':'J',x:'F',j:'F',c:'MS',k:'MS',Escape:'P'};
addEventListener('keydown',e=>{ const k=KMAP[e.key.length===1?e.key.toLowerCase():e.key];
  if(k){ keys[k]=true; e.preventDefault(); if(!AC){ac();startDrone();} } });
addEventListener('keyup',e=>{ const k=KMAP[e.key.length===1?e.key.toLowerCase():e.key];
  if(k){ keys[k]=false; e.preventDefault(); } });
const pressed = k => keys[k] && !prev[k];

// ---------------------------------------------------------------- estado
const ITEMNAMES = {
  M:['ESFERA COMPACTA','Pressione BAIXO para virar esfera','e cruzar tuneis estreitos.'],
  B:['BOMBAS DE FASE','Em modo esfera, TIRO solta bombas.','Destroem blocos rachados.'],
  J:['ASAS DE ION','Pressione PULO no ar','para um segundo impulso.'],
  T:['NUCLEO DE CARGA','Segure TIRO para carregar','um disparo devastador.'],
  U:['TURBINAS CINETICAS','Corra sem parar para romper','os blocos ambar em alta velocidade.'],
  E:['TANQUE DE ENERGIA','+100 de energia maxima.','Energia restaurada.'],
  m:['CELULAS DE MISSEIS','+5 misseis (tecla C).','Abrem as portas vermelhas.'],
};
let st, pl, ents, shots, bombs, parts, popup, boss, artifact, shake, mode, deadTimer, visited;
function freshState(){
  return { items:{M:0,B:0,J:0,T:0,U:0}, maxE:99, missiles:0, missMax:0,
    collected:[], opened:[], broken:[], bossDead:0, check:[startPos[0],startPos[1]], time:0 };
}
function applyState(){
  buildMap();
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(c==='P'){ startPos=[x*T+3,y*T]; grid[y][x]='.'; }
    if(c==='X'){ bossSpawn=[x*T,y*T]; grid[y][x]='.'; }
  }
  for(const k of st.collected.concat(st.opened,st.broken)){
    const [x,y]=k.split(',').map(Number); grid[y][x]='.';
  }
  ents=[]; shots=[]; bombs=[]; parts=[]; boss=null; artifact=null;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=grid[y][x];
    if(c==='c'){ ents.push({t:'c',x:x*T+2,y:y*T+4,w:12,h:12,vx:0.5,hp:3,fl:0}); grid[y][x]='.'; }
    if(c==='f'){ ents.push({t:'f',x:x*T+2,y:y*T+2,w:12,h:10,sx:x*T+2,sy:y*T+2,ph:Math.random()*6,hp:2,fl:0}); grid[y][x]='.'; }
  }
  if(st.bossDead) artifact={x:bossSpawn[0],y:bossSpawn[1]+40,ph:0};
}
function newPlayer(x,y){
  return {x,y,vx:0,vy:0,w:10,h:22,face:1,ball:0,onG:0,coyote:0,dj:0,
    e:st.maxE,inv:0,charge:0,run:0,kb:0};
}
function save(){
  st.check=[pl.x,pl.y-2];
  try{ localStorage.setItem('ecozeron', JSON.stringify(st)); }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem('ecozeron'); }catch(e){ return false; } }

// ---------------------------------------------------------------- fisica
function rectHits(x,y,w,h){
  for(let ty=Math.floor(y/T); ty<=Math.floor((y+h-1)/T); ty++)
    for(let tx=Math.floor(x/T); tx<=Math.floor((x+w-1)/T); tx++){
      const px=tx*T, py=ty*T, c=tileAt(px,py);
      if(SOLID.includes(c)) return {tx,ty,c};
    }
  return null;
}
function moveAxis(e, dx, dy, onHit){
  let total=Math.abs(dx||dy), s=Math.sign(dx||dy), hit=false;
  while(total>0){
    const step=Math.min(1,total);
    if(dx) e.x+=s*step; else e.y+=s*step;
    const h=rectHits(e.x,e.y,e.w,e.h);
    if(h){
      if(onHit && onHit(h)) { total-=step; continue; } // bloco destruido, segue
      if(dx) e.x-=s*step; else e.y-=s*step;
      hit=true; break;
    }
    total-=step;
  }
  return hit;
}
function breakTile(tx,ty){
  st.broken.push(tx+','+ty); grid[ty][tx]='.';
  burst(tx*T+8,ty*T+8,10,'#d9a441');
}
function openDoor(tx,ty){
  const c=grid[ty][tx], q=[[tx,ty]];
  while(q.length){
    const [x,y]=q.pop();
    if(x<0||x>=W||y<0||y>=H||grid[y][x]!==c) continue;
    grid[y][x]='.'; st.opened.push(x+','+y);
    burst(x*T+8,y*T+8,6,c==='D'?'#4db8ff':'#ff5566');
    q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  sfx.door();
}
function burst(x,y,n,col,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, v=(spd||1.6)*(0.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.5,life:20+Math.random()*25,col,sz:1+Math.random()*2});
  }
}

// ---------------------------------------------------------------- jogador
function hurt(dmg,kx){
  if(pl.inv>0||mode!=='play') return;
  pl.e-=dmg; pl.inv=60; pl.vy=-3.5; pl.vx=(kx||(-pl.face))*3; pl.kb=14; shake=6;
  sfx.hurt(); burst(pl.x+5,pl.y+10,8,'#ff7755');
  if(pl.e<=0){ pl.e=0; mode='dead'; deadTimer=0; sfx.die(); burst(pl.x+5,pl.y+10,40,'#7fe9e0',3); }
}
function updatePlayer(){
  const acc=0.4, top = (st.items.U && pl.run>26) ? 4.2 : 2.1;
  if(pl.kb>0){ pl.kb--; }
  else{
    if(keys.L){ pl.vx=Math.max(pl.vx-acc,-top); pl.face=-1; }
    else if(keys.R){ pl.vx=Math.min(pl.vx+acc,top); pl.face=1; }
    else pl.vx*=pl.onG?0.6:0.92;
  }
  // turbinas: contador de corrida continua
  if(st.items.U && pl.onG && ((keys.L&&pl.vx<-1.6)||(keys.R&&pl.vx>1.6))) pl.run++;
  else if(pl.onG && Math.abs(pl.vx)<1) pl.run=0;
  const turbo = st.items.U && pl.run>26 && Math.abs(pl.vx)>3.2;
  if(turbo && Math.random()<0.5) parts.push({x:pl.x+5-pl.face*6,y:pl.y+pl.h-3,vx:-pl.face,vy:-0.3,life:14,col:'#ffd055',sz:2});

  // modo esfera
  if(pressed('DN') && st.items.M && !pl.ball){ pl.ball=1; pl.h=12; pl.y+=10; sfx.ball(); }
  else if(pressed('DN') && pl.ball){
    if(!rectHits(pl.x,pl.y-10,pl.w,22)){ pl.ball=0; pl.h=22; pl.y-=10; sfx.ball(); }
  }
  // pulo
  if(pl.onG) { pl.coyote=6; pl.dj=0; } else if(pl.coyote>0) pl.coyote--;
  if(pressed('J')){
    if(pl.coyote>0){ pl.vy=-6.3; pl.coyote=0; sfx.jump(); }
    else if(st.items.J && !pl.dj && !pl.ball){ pl.vy=-5.8; pl.dj=1; sfx.jump2();
      burst(pl.x+5,pl.y+pl.h,8,'#9fe9ff',1.2); }
  }
  if(!keys.J && pl.vy<-2.5) pl.vy=-2.5;          // pulo controlavel
  pl.vy=Math.min(pl.vy+0.32,7);

  // movimento + colisao (turbo quebra blocos Q)
  const qBreak = h => {
    if(h.c==='Q' && turbo){ breakTile(h.tx,h.ty); sfx.qbreak(); shake=3; return true; }
    return false;
  };
  moveAxis(pl,pl.vx,0,qBreak) && (pl.vx=0);
  pl.onG=0;
  if(moveAxis(pl,0,pl.vy)){ if(pl.vy>0) pl.onG=1; pl.vy=0; }

  // tiro / bombas / misseis
  if(pl.ball){
    if(pressed('F') && st.items.B && bombs.length<3){
      bombs.push({x:pl.x+1,y:pl.y+2,t:50}); sfx.bomb();
    }
  } else {
    if(keys.F && st.items.T) pl.charge=Math.min(pl.charge+1,55);
    if(pressed('F')){
      const up=keys.U;
      shots.push({x:pl.x+(up?3:(pl.face>0?10:-4)), y:pl.y+(up?-4:7),
        vx:up?0:pl.face*6, vy:up?-6:0, dmg:1, ty:'n', life:55});
      sfx.shoot();
    }
    if(!keys.F && pl.charge>=55){
      const up=keys.U;
      shots.push({x:pl.x+(up?1:(pl.face>0?10:-8)), y:pl.y+(up?-8:4),
        vx:up?0:pl.face*6.5, vy:up?-6.5:0, dmg:4, ty:'c', life:70, pierce:2});
      sfx.charged(); shake=2;
    }
    if(!keys.F) pl.charge=0;
    if(pressed('MS')){
      if(st.missiles>0){
        st.missiles--;
        const up=keys.U;
        shots.push({x:pl.x+(up?3:(pl.face>0?10:-6)), y:pl.y+(up?-6:6),
          vx:up?0:pl.face*4.5, vy:up?-4.5:0, dmg:5, ty:'m', life:80});
        sfx.missile();
      } else sfx.deny();
    }
  }
  if(pl.charge>30 && Math.random()<0.4){
    const a=Math.random()*6.283;
    parts.push({x:pl.x+5+Math.cos(a)*10,y:pl.y+8+Math.sin(a)*10,
      vx:-Math.cos(a),vy:-Math.sin(a),life:10,col:'#aef',sz:1});
  }
  if(pl.inv>0) pl.inv--;

  // perigos do cenario
  const cx=pl.x+pl.w/2, fy=pl.y+pl.h;
  for(let ty=Math.floor(pl.y/T); ty<=Math.floor((fy-1)/T); ty++){
    const c=tileAt(cx,ty*T+1);
    if(c==='~'){ pl.e-=0.5; if(pl.e<=0){pl.e=0;mode='dead';deadTimer=0;sfx.die();}
      if(Math.random()<0.3) parts.push({x:cx,y:fy-4,vx:0,vy:-1,life:18,col:'#7f6',sz:2}); }
    if(c==='^') hurt(18, pl.vx>0?-1:1);
  }
  // itens (tiles)
  for(let ty=Math.floor(pl.y/T); ty<=Math.floor((fy-1)/T); ty++)
    for(let tx=Math.floor(pl.x/T); tx<=Math.floor((pl.x+pl.w-1)/T); tx++){
      const c=grid[ty]&&grid[ty][tx];
      if(c && ITEMNAMES[c]) collect(tx,ty,c);
    }
  // checkpoint
  const under=tileAt(cx,fy+2);
  if(under==='V' && pl.onG){
    const key=Math.floor(cx/T)+'v';
    if(pl.lastSave!==key){
      pl.lastSave=key; pl.e=st.maxE; st.missiles=st.missMax; save(); sfx.save();
      popup={title:'PROGRESSO REGISTRADO',lines:['Energia e misseis restaurados.'],t:0};
    }
  }
  // chefao: gatilho da arena
  if(!boss && !st.bossDead && pl.x>73*T && pl.y>16*T && pl.y<30*T){
    boss={x:bossSpawn[0],y:18*T,vx:0,vy:0,w:40,h:40,hp:60,max:60,ph:0,cd:90,fl:0,spawned:0};
    shake=8; tone(60,200,1.2,'sawtooth',0.2);
  }
  // artefato -> vitoria
  if(artifact && Math.abs(pl.x+5-artifact.x-8)<14 && Math.abs(pl.y+10-artifact.y-8)<16){
    mode='win'; deadTimer=0; sfx.pickup(); save();
  }
  st.time++;
}
function collect(tx,ty,c){
  grid[ty][tx]='.'; st.collected.push(tx+','+ty);
  if(c==='E'){ st.maxE+=100; pl.e=st.maxE; }
  else if(c==='m'){ st.missMax+=5; st.missiles+=5; }
  else st.items[c]=1;
  sfx.pickup(); burst(tx*T+8,ty*T+8,18,'#ffe066',2);
  const n=ITEMNAMES[c];
  popup={title:n[0],lines:[n[1],n[2]],t:0,item:c};
}

// ---------------------------------------------------------------- inimigos
function updateEnts(){
  for(const e of ents){
    if(e.hp<=0) continue;
    if(e.fl>0) e.fl--;
    if(e.t==='c'){
      e.vy=(e.vy||0)+0.3; moveAxis(e,0,e.vy)&&(e.vy=0);
      const ahead=e.x+(e.vx>0?e.w+1:-1);
      if(solidAt(ahead,e.y+e.h/2) || !solidAt(ahead,e.y+e.h+2)) e.vx*=-1;
      moveAxis(e,e.vx,0)&&(e.vx*=-1);
    } else { // voador
      e.ph+=0.04;
      const dx=pl.x-e.x, dy=pl.y-e.y, d=Math.hypot(dx,dy)||1;
      if(d<140){ e.x+=dx/d*0.55; e.y+=dy/d*0.55; }
      else { e.x+=(e.sx-e.x)*0.01; e.y=e.sy+Math.sin(e.ph)*18; }
    }
    // contato
    if(pl.inv<=0 && overlap(e,pl)) hurt(e.t==='c'?15:10, pl.x<e.x?-1:1);
    // turbo atropela
    if(st.items.U && pl.run>26 && Math.abs(pl.vx)>3.2 && overlap(e,pl)) hitEnt(e,3);
  }
  ents=ents.filter(e=>e.hp>0||e.dieAnim>0);
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function hitEnt(e,dmg){
  e.hp-=dmg; e.fl=8; sfx.ekill();
  if(e.hp<=0){
    burst(e.x+e.w/2,e.y+e.h/2,14,e.t==='c'?'#c96':'#b7f',2);
    if(Math.random()<0.45) ents.push({t:'orb',x:e.x+2,y:e.y,w:8,h:8,vy:-2,
      kind:Math.random()<0.7?'e':'m',life:420,hp:1});
  }
}
function updateOrbs(){
  for(const e of ents){
    if(e.t!=='orb') continue;
    e.vy=Math.min((e.vy||0)+0.25,4); moveAxis(e,0,e.vy)&&(e.vy=0);
    e.life--; if(e.life<=0) e.hp=0;
    if(overlap(e,pl)){
      e.hp=0; sfx.orb();
      if(e.kind==='e') pl.e=Math.min(pl.e+10,st.maxE);
      else st.missiles=Math.min(st.missiles+1,st.missMax);
    }
  }
}
function updateBoss(){
  if(!boss) return;
  boss.ph+=0.02; if(boss.fl>0) boss.fl--;
  const cx=84*T, baseY=19*T;
  boss.x += (cx-60+Math.cos(boss.ph)*70 - boss.x)*0.03;
  boss.y += (baseY+Math.sin(boss.ph*1.7)*30 - boss.y)*0.03;
  if(--boss.cd<=0){
    boss.cd = boss.hp<30 ? 75 : 110;
    const bx=boss.x+20, by=boss.y+20;
    for(let i=-1;i<=1;i++){
      const a=Math.atan2(pl.y+10-by, pl.x+5-bx)+i*0.3;
      shots.push({x:bx,y:by,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,dmg:15,ty:'e',life:200});
    }
    tone(330,110,0.2,'square',0.08);
  }
  if(boss.hp<=30 && !boss.spawned){
    boss.spawned=1;
    ents.push({t:'f',x:boss.x,y:boss.y-20,w:12,h:10,sx:boss.x,sy:boss.y-20,ph:0,hp:2,fl:0});
    ents.push({t:'f',x:boss.x+30,y:boss.y+50,w:12,h:10,sx:boss.x+30,sy:boss.y+50,ph:3,hp:2,fl:0});
  }
  if(pl.inv<=0 && overlap(boss,pl)) hurt(25, pl.x<boss.x?-1:1);
  if(boss.hp<=0){
    st.bossDead=1; shake=14; sfx.boom();
    for(let i=0;i<5;i++) setTimeout(()=>sfx.boom(), i*180);
    burst(boss.x+20,boss.y+20,60,'#ff8855',3.5);
    burst(boss.x+20,boss.y+20,40,'#ffe066',2.5);
    artifact={x:boss.x+12,y:boss.y+30,ph:0};
    boss=null; save();
  }
}
