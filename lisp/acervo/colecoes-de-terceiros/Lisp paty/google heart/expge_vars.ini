[expge]
versao = "1.11" {versão}
icon = "http://maps.google.com/mapfiles/kml/pal4/icon24.png"
attr = "PONTO"      {nome do atributo que é usado como nome}
descr = "DESCRICAO" {nome do atributo que é usado como descrição}
cota = 2        {0->"relativeToGround" 1->"absolute" 2->"clampedToGround"}
abrege = "1"    {"1"-> sim, "0", não}
lingua = 0      {0 é o primeiro da lista}
fuso = 22         {fuso, veja: "http://www.gpsglobal.com.br/Artigos/MapImpr/MI14.html"}
referencial = 2   {0 é o primeiro da lista}
hemisferio = "S"  {"s"-> SUL, "N" -> NORTE}
layer = "0"       {layer padrão}
semi = 6378137.0  {raio da terra}
f = 298.257223563 {achatamento}
dx = 0.0          {translações}
dy = 0.0
dz = 0.0
noelev = "1"     {"1" -> readkml ignora as cotas, "0" -> usa}
coord = "utm"    {"utm" ou "geo" }
import = "block" {"point" -> importa markedpoint como point, "block" -> bloco}